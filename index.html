<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">База Героев</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #00adb5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
			position: relative;
        }

		.lang-switcher {
		    position: absolute;
		    top: 10px;
		    right: 20px;
		    background-color: var(--card-bg);
		    color: var(--text-color);
		    border: 1px solid var(--accent);
		    padding: 8px 16px;
		    border-radius: 4px;
		    cursor: pointer;
		    font-weight: bold;
		    font-size: 14px;
		    transition: background-color 0.2s, color 0.2s;
		    z-index: 10; /* Чтобы кнопка всегда была поверх остальных элементов */
		}
		
		.lang-switcher:hover {
		    background-color: var(--accent);
		    color: var(--bg-color);
		}

		h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 30px;
        }

        /* Панель управления */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .control-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Карточка */
        .hero-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .hero-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .hero-avatar-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Соотношение сторон 1:1 */
            background-color: #111;
        }

        .hero-avatar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .hero-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #111;
        }

        .hero-name {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            color: #fff;
        }
		.hero-badges-container {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.hero-badges {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}
		.badge {
            display: inline-flex;
			background-color: var(--accent);
            color: #1a1a1a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            align-self: flex-start;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 14px;
            border-top: 1px solid #444;
            padding-top: 12px;
            margin-top: auto;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .info-value {
            font-weight: 500;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="lang-switcher" id="langBtn" onclick="toggleLanguage()">EN</button>
    <h1 id="mainTitle">Герои</h1>

    <!-- Панель управления -->
    <div class="controls">
        <div class="control-group">
            <label for="search">Поиск по имени</label>
            <input type="text" id="search" placeholder="Введите имя...">
        </div>
        <div class="control-group">
            <label for="filterType">Тип персонажа</label>
            <select id="filterType">
                <option value="all">Все типы</option>
				<option value="MAIN">Главный герой</option>
                <option value="SECONDARY">Биом</option>
                <option value="CONTRACT">Контракт</option>
				<option value="HUNT">Охота</option>
				<option value="PREMIUM">Премиум</option>
             </select>
        </div>
		<div class="control-group">
            <label for="filterClass">Класс персонажа</label>
            <select id="filterClass">
                <option value="all">Все классы</option>
				<option value=1>Сила</option>
                <option value=2>Ловкость</option>
                <option value=3>Интеллект</option>
             </select>
        </div>
		<div class="control-group">
            <label for="filterAlliance">Альянс персонажа</label>
            <select id="filterAlliance">
                <option value="all">Все альянсы</option>
				<option value=1>Осквернитель</option>
                <option value=2>Жрец</option>
                <option value=3>Убийца</option>
				<option value=4>Боец</option>
                <option value=5>Защитник</option>
             </select>
        </div>
		<div class="control-group">
            <label for="filterRace">Раса персонажа</label>
            <select id="filterRace">
                <option value="all">Все расы</option>
				<option value=1>Люди</option>
                <option value=2>Звери</option>
                <option value=3>Гномы</option>
				<option value=4>Демоны</option>
                <option value=5>Нежить</option>
                <option value=6>Эльфы</option>
				<option value=7>Орки</option>
                <option value=8>Механизмы</option>
                <option value=9>Энты</option>
				<option value=10>Перворожденные</option>
             </select>
        </div>
        <div class="control-group">
            <label for="sortMIX">Сортировка</label>
            <select id="sortMIX">
                <option value="none">Без сортировки</option>
                <option value="ascName">По возрастанию имени</option>
                <option value="descName">По убыванию имени</option>
				<option value="ascBaseID">По возрастанию ID</option>
                <option value="descBaseID">По убыванию ID</option>
            </select>
        </div>
    </div>

    <!-- Сетка с карточками -->
    <div class="grid" id="heroesGrid"></div>
</div>

<script>
// 1. Хранилище данных и текущее состояние
let heroesData = []; 
const grid = document.getElementById('heroesGrid');
let currentLang = 'ru'; 

// 2. Исправленные мапперы (поддерживают и числа, и строки в качестве ключей)
const classMapper = { 1: 'Сила', 2: 'Ловкость', 3: 'Интеллект' };
const allianceMapper = { 1: 'Осквернитель', 2: 'Жрец', 3: 'Убийца', 4: 'Боец', 5: 'Защитник' };
const raceMapper = { 1: 'Люди', 2: 'Звери', 3: 'Орки', 4: 'Нежить', 5: 'Эльфы', 6: 'Гномы', 7: 'Демоны', 8: 'Механизмы', 9: 'Энты', 10: 'Перворожденные' };
const typeMapper = { 'MAIN': 'ГЛАВНЫЙ ГЕРОЙ', 'HUNT': 'ОХОТА', 'PREMIUM': 'ПРЕМИУМ' };

// 3. Централизованный словарь (Данные переводятся с РУССКОГО ключа)
const translations = {
  ru: {
    ui: { title: "База Героев", mainTitle: "Герои", searchLabel: "Поиск по имени", searchPlaceholder: "Введите имя..." },
    error: "Ошибка: ",
    noResults: "Персонажи не найдены",
    data: {
      "ГЛАВНЫЙ ГЕРОЙ": "ГЛАВНЫЙ ГЕРОЙ", "ОХОТА": "ОХОТА", "ПРЕМИУМ": "ПРЕМИУМ",
      "Сила": "Сила", "Ловкость": "Ловкость", "Интеллект": "Интеллект",
      "Люди": "Люди", "Звери": "Звери", "Орки": "Орки", "Нежить": "Нежить", "Эльфы": "Эльфы", 
      "Гномы": "Гномы", "Демоны": "Демоны", "Энты": "Энты", "Механизмы": "Механизмы", "Перворожденные": "Перворожденные",
      "Осквернитель": "Осквернитель", "Жрец": "Жрец", "Убийца": "Убийца", "Боец": "Боец", "Защитник": "Защитник"
    }
  },
  en: {
    ui: { title: "Heroes Database", mainTitle: "Heroes", searchLabel: "Search by name", searchPlaceholder: "Enter name..." },
    error: "Error: ",
    noResults: "No characters found",
    data: {
      "ГЛАВНЫЙ ГЕРОЙ": "MAIN HERO", "ОХОТА": "HUNT", "ПРЕМИУМ": "PREMIUM",
      "Сила": "Strength", "Ловкость": "Agility", "Интеллект": "Intelligence",
      "Люди": "Humans", "Звери": "Beasts", "Орки": "Orcs", "Нежить": "Undead", "Эльфы": "Elves", 
      "Гномы": "Dwarves", "Демоны": "Demons", "Энты": "Ents", "Механизмы": "Mechanisms", "Перворожденные": "Firstborn",
      "Осквернитель": "Defiler", "Жрец": "Priest", "Убийца": "Assassin", "Боец": "Fighter", "Защитник": "Defender"
    }
  }
};

// 4. Функция динамической локализации карточек (перевод по русскому ключу)
function getTxt(russianKey) {
  if (!russianKey) return '';
  return translations[currentLang].data[russianKey] || russianKey;
}

// 5. Переключение языка интерфейса и карточек
function toggleLanguage() {
  currentLang = currentLang === 'ru' ? 'en' : 'ru';
  document.documentElement.lang = currentLang;
  
  // Меняем текст кнопки
  document.getElementById('langBtn').textContent = currentLang === 'ru' ? 'EN' : 'RU';
  // Переводим статичные заголовки
  document.getElementById('mainTitle').textContent = translations[currentLang].ui.mainTitle;
  document.title = translations[currentLang].ui.title;
  
  // Перерисовываем карточки с новым языком
  updateDisplay();
}

// 6. Загрузка данных (ИСПРАВЛЕНО имя файла на heroes.json)
async function loadHeroes() {
  try {
    const response = await fetch('heroes.json'); 
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    heroesData = await response.json();
    updateDisplay(); // Запуск отображения через фильтр
  } catch (error) {
    grid.innerHTML = `<div class="no-results">${translations[currentLang].error}${error.message}</div>`;
  }
}

// 7. Рендеринг карточек героев
function renderCards(data) {
  grid.innerHTML = '';
  
  if (data.length === 0) {
    grid.innerHTML = `<div class="no-results">${translations[currentLang].noResults}</div>`;
    return;
  }

  data.forEach(hero => {
    // Получаем эталонные русские значения из мапперов
    const rawType = typeMapper[hero.data.character_type] || hero.data.character_type;
    const rawClass = classMapper[hero.data.class_id] || hero.data.class_id;
    const rawAlliance = allianceMapper[hero.data.alliance_id] || hero.data.alliance_id;
    const rawRace = raceMapper[hero.data.race_id] || hero.data.race_id;
	const cleanName = hero.data.name.trim();
	const cleanType = hero.data.character_type.trim();
    const card = document.createElement('div');
	
    card.className = 'hero-card';
    card.innerHTML = `
      <div class="hero-avatar-container">
        <img class="hero-avatar" src="${hero.data.avatar}" alt="${hero.data.name}" onerror="this.src='https://placeholder.com'">
      </div>
      <div class="hero-card-content">
		  <div class="hero-name">${hero.data.name}</div>
	      <!--<div class="hero-tags"> -->
	        <!-- getTxt переведет русскую строку на нужный язык автоматически -->
	        <!--<span class="tag tag-type">${getTxt(rawType)}</span> -->
	        <!--<span class="tag tag-class">${getTxt(rawClass)}</span> -->

					<div class="hero-badges-container">
						<div class="hero-badges">
							<!--//<span class="badge" style="background: #6FECD3;">${typeMapper[cleanType] || cleanType}</span> -->
		                    <!--//<span class="badge" style="background: #FF5C5C;">${classMapper[hero.data.class_id] || hero.data.class_id}</span> -->
							<span class="badge" style="background: #6FECD3;">${getTxt(rawType)}</span>
		                    <span class="badge" style="background: #FF5C5C;">${getTxt(rawClass)}</span>
						</div>
		                <div class="hero-badges">
							<span class="badge" style="background: #4A90E2;">${raceMapper[hero.data.race_id] || hero.data.race_id}</span>
		                    <span class="badge" style="background: #F7BF64;">${allianceMapper[hero.data.alliance_id] || hero.data.alliance_id}</span>
						</div>
					</div>
		  <!--</div> -->
	      <!--<div class="hero-info"> -->
	      <!--  <p><strong>${currentLang === 'ru' ? 'Альянс' : 'Alliance'}:</strong> ${getTxt(rawAlliance)}</p> -->
	      <!--  <p><strong>${currentLang === 'ru' ? 'Раса' : 'Race'}:</strong> ${getTxt(rawRace)}</p> -->
	      <!--</div> -->
	      <div class="hero-footer">
	        <div><span class="info-label">Base ID</span><span class="info-value"> ${hero.data.base_character_id}</span></div>
	        <div><span class="info-label">MAX Star</span><span class="info-value"> ${'★'.repeat(hero.data.max_stardom || 0)}</span></div>
	      </div>
	  </div>
    `;
    grid.appendChild(card);
  });
}

// 8. Логика фильтрации и сортировки
function updateDisplay() {
  const searchQuery = document.getElementById('search').value.toLowerCase();
  const typeFilter = document.getElementById('filterType').value;
  const classFilter = document.getElementById('filterClass').value;
  const allianceFilter = document.getElementById('filterAlliance').value;
  const raceFilter = document.getElementById('filterRace').value;
  const sortValue = document.getElementById('sortMIX').value;

  let filtered = heroesData.filter(hero => {
    const matchesSearch = hero.data.name.toLowerCase().includes(searchQuery);
    const matchesType = typeFilter === 'all' || hero.data.character_type === typeFilter;
    const matchesClass = classFilter === 'all' || String(hero.data.class_id) === classFilter;
    const matchesAlliance = allianceFilter === 'all' || String(hero.data.alliance_id) === allianceFilter;
    const matchesRace = raceFilter === 'all' || String(hero.data.race_id) === raceFilter;

    return matchesSearch && matchesType && matchesClass && matchesAlliance && matchesRace;
  });

  // Сортировка
  if (sortValue === 'ascName') {
    filtered.sort((a, b) => a.data.name.localeCompare(b.data.name, 'ru'));
  } else if (sortValue === 'descName') {
    filtered.sort((a, b) => b.data.name.localeCompare(a.data.name, 'ru'));
  } else if (sortValue === 'ascID') {
    filtered.sort((a, b) => a.data.base_character_id - b.data.base_character_id);
  } else if (sortValue === 'descID') {
    filtered.sort((a, b) => b.data.base_character_id - a.data.base_character_id);
  }

  renderCards(filtered);
}

// 9. Навешивание событий и старт
document.getElementById('search').addEventListener('input', updateDisplay);
document.getElementById('filterType').addEventListener('change', updateDisplay);
document.getElementById('filterClass').addEventListener('change', updateDisplay);
document.getElementById('filterAlliance').addEventListener('change', updateDisplay);
document.getElementById('filterRace').addEventListener('change', updateDisplay);
document.getElementById('sortMIX').addEventListener('change', updateDisplay);

// Запуск приложения
loadHeroes();
</script>

</body>
</html>
