<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Переводим title через словарь -->
    <title data-i18n="ui.title">TFBWiKi</title>
    <link rel="stylesheet" href="styles.css">
    <script src="common.js" defer></script>
</head>
<body class="page-home">
    <header class="main-header">
        <!-- Заголовок тоже помечаем -->
        <h1 class="wiki-title" data-i18n="ui.wikiTitle">TFBWiKi</h1>
        <button id="langBtn" class="lang-switcher" type="button" onclick="toggleLanguage()">EN</button>
    </header>

    <main class="home-grid">
        <a href="heroes.html" class="card-link">
            <div class="card">
                <!-- Добавляем data-i18n -->
                <h2 data-i18n="card.heroes.title">ГЕРОИ</h2>
                <p data-i18n="card.heroes.desc">База персонажей и их способностей</p>
            </div>
        </a>
        <a href="resources.html" class="card-link">
            <div class="card">
                <h2 data-i18n="card.resources.title">РЕСУРСЫ</h2>
                <p data-i18n="card.resources.desc">Ресурсы, сортировка</p>
            </div>
        </a>
        <a href="recipes.html" class="card-link">
            <div class="card">
                <h2 data-i18n="card.recipes.title">РЕЦЕПТЫ</h2>
                <p data-i18n="card.recipes.desc">Крафты, компоненты и требования</p>
            </div>
        </a>
    </main>
</body>
</html>
