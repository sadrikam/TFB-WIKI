<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Героев</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #00adb5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 30px;
        }

        /* Панель управления */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .control-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        /* Сетка карточек */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Карточка */
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .avatar-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Соотношение сторон 1:1 */
            background-color: #111;
        }

        .avatar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #111;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            color: #fff;
        }
		.hero-badges-container {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.hero-badges {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}
		.badge {
            display: inline-flex;
			background-color: var(--accent);
            color: #1a1a1a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            align-self: flex-start;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 14px;
            border-top: 1px solid #444;
            padding-top: 12px;
            margin-top: auto;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .info-value {
            font-weight: 500;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Переключатель языков -->
    <div style="text-align: right; margin-bottom: 10px;">
        <select id="languageSelect" style="padding: 5px 10px; font-size: 14px; min-width: auto; cursor: pointer;">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
    </div>
    <h1 id="mainTitle">Герои</h1>

    <!-- Панель управления -->
    <div class="controls">
        <div class="control-group">
            <label for="search" id="searchLabel">Поиск по имени</label>
            <input type="text" id="search" placeholder="Введите имя...">
        </div>
        <div class="control-group">
            <label for="selectType">Тип персонажа</label>
            <select id="selectType">
                <option value="all">Все типы</option>
				<option value="MAIN">Главный герой</option>
                <option value="SECONDARY">Биом</option>
                <option value="CONTRACT">Контракт</option>
				<option value="HUNT">Охота</option>
				<option value="PREMIUM">Премиум</option>
             </select>
        </div>
		<div class="control-group">
            <label for="selectClass">Класс персонажа</label>
            <select id="selectClass">
                <option value="all">Все классы</option>
				<option value=1>Сила</option>
                <option value=2>Ловкость</option>
                <option value=3>Интеллект</option>
             </select>
        </div>
		<div class="control-group">
            <label for="selectAlliance">Альянс персонажа</label>
            <select id="selectAlliance">
                <option value="all">Все альянсы</option>
				<option value=1>Осквернитель</option>
                <option value=2>Жрец</option>
                <option value=3>Убийца</option>
				<option value=4>Боец</option>
                <option value=5>Защитник</option>
             </select>
        </div>
		<div class="control-group">
            <label for="selectRace">Раса персонажа</label>
            <select id="selectRace">
                <option value="all">Все расы</option>
				<option value=1>Люди</option>
                <option value=2>Звери</option>
                <option value=3>Гномы</option>
				<option value=4>Демоны</option>
                <option value=5>Нежить</option>
                <option value=6>Эльыф</option>
				<option value=7>Орки</option>
                <option value=8>Механизмы</option>
                <option value=9>Энты</option>
				<option value=10>Перворожденные</option>
             </select>
        </div>
        <div class="control-group">
            <label for="sortMIX">Сортировка</label>
            <select id="sortMIX">
                <option value="none">Без сортировки</option>
                <option value="ascName">По возрастанию имени</option>
                <option value="descName">По убыванию имени</option>
				<option value="ascBaseID">По возрастанию ID</option>
                <option value="descBaseID">По убыванию ID</option>
            </select>
        </div>
    </div>

    <!-- Сетка с карточками -->
    <div class="grid" id="heroesGrid"></div>
</div>

<script>
    let heroesData = [];
	// Текущий выбранный язык
	let currentLang = 'ru';
	
	const grid = document.getElementById('heroesGrid');
    const searchInput = document.getElementById('search');
    const filterType = document.getElementById('filterType');
	const filterClass = document.getElementById('filterClass');
	const filterAlliance = document.getElementById('filterAlliance');
	const filterRace = document.getElementById('filterRace');
    const sortMIX = document.getElementById('sortMIX');
	
	// Словарь интерфейса (ru/en)
	//const translations = {
	//    ru: { title: "База Героев", mainTitle: "Герои", searchPlaceholder: "Введите имя...", noResults: "Персонажи не найдены" },
	//    en: { title: "Hero Database", mainTitle: "Heroes", searchPlaceholder: "Enter name...", noResults: "Heroes not found" }
	//};
	const uiTranslations = {
	    ru: {
	        mainTitle: 'База героев',
	        searchPlaceholder: 'Поиск по имени...',
	        classLabel: 'Класс',
	        allOption: 'Все',
	        noResults: 'Ничего не найдено'
	    },
	    en: {
	        mainTitle: 'Heroes Database',
	        searchPlaceholder: 'Search by name...',
	        classLabel: 'Class',
	        allOption: 'All',
	        noResults: 'No results found'
	    }
	};
	
	// Мапперы для категорий (названия классов, рас и т.д. на двух языках)
	const classMapper = {
	    ru: { 1: 'Сила', 2: 'Ловкость', 3: 'Интеллект' },
	    en: { 1: 'Strength', 2: 'Agility', 3: 'Intelligence' }
	};
	const allianceMapper = {
	    ru: { 1: 'Осквернитель', 2: 'Жрец', 3: 'Убийца', 4: 'Боец', 5: 'Защитник' },
	    en: { 1: 'Defiler', 2: 'Priest', 3: 'Assassin', 4: 'Fighter', 5: 'Defender' }
	};
	const raceMapper = {
	    ru: { 1: 'Люди', 2: 'Звери', 3: 'Гномы', 4: 'Демоны', 5: 'Нежить', 6: 'Эльфы', 7: 'Орки', 8: 'Механцизмы', 9: 'Энты', 10: 'Перворожденные' },
	    en: { 1: 'Humans', 2: 'Beasts', 3: 'Dwarves', 4: 'Demons', 5: 'Undead', 6: 'Elves', 7: 'Orcs', 8: 'Mechanisms', 9: 'Ents', 10: 'Firstborn' }
	};
	const typeMapper = {
	    ru: { 'MAIN': 'ГЛАВНЫЙ ГЕРОЙ', 'HUNT': 'ОХОТА', 'SECONDARY': 'БИОМ', 'PREMIUM': 'ПРЕМИУМ' },
	    en: { 'MAIN': 'MAIN HERO', 'HUNT': 'HUNT', 'SECONDARY': 'BIOME', 'PREMIUM': 'PREMIUM' }
	};
	
    // Исправлено: Загрузка данных и вызов отрисовки
    async function loadHeroes() {
        try {
            const response = await fetch('herous.json');
            if (!response.ok) throw new Error('Ошибка сети');
            heroesData = await response.json();
            renderCards(heroesData);
        } catch (error) {
            grid.innerHTML = `<div class="no-results">Ошибка: ${error.message}</div>`;
        }
    }

	/**
	 * Функция изменения глобального языка интерфейса приложения.
	 * @param {string} lang - Идентификатор выбранного языка ('ru' или 'en')
	 */
	function setLanguage(lang) {
	    // === БЛОК 1: СОХРАНЕНИЕ ТЕКУЩЕГО ЯЗЫКА ===
	    // Перезаписываем глобальную переменную, чтобы все остальные функции 
	    // (включая renderCards) знали, какой язык сейчас выбран пользователем.
	    currentLang = lang;
	
	    // Ссылка на объект с переводами интерфейса для удобства написания кода
	    const t = uiTranslations[lang];
	    if (!t) return; // Защита: если переводы для языка не описаны, выходим из функции
	
	    // === БЛОК 2: АКТИВАЦИЯ КНОПОК ПЕРЕКЛЮЧЕНИЯ ЯЗЫКА ===
	    // Переключаем визуальный класс 'active' на кнопках выбора языка, 
	    // чтобы пользователь видел, какой язык сейчас активен в интерфейсе.
	    const btnRu = document.getElementById('btnRu');
	    const btnEn = document.getElementById('btnEn');
	    
	    if (btnRu && btnEn) {
	        if (lang === 'ru') {
	            btnRu.classList.add('active');
	            btnEn.classList.remove('active');
	        } else {
	            btnEn.classList.add('active');
	            btnRu.classList.remove('active');
	        }
	    }
	
	    // === БЛОК 3: ПЕРЕВОД СТАТИЧЕСКИХ ТЕКСТОВЫХ ЭЛЕМЕНТОВ (UI) ===
	    // Находим элементы страницы по их ID и меняем текстовое содержимое 
	    // на перевод из нашего словаря uiTranslations.
	    
	    // Перевод главного заголовка страницы (например, "База героев" / "Heroes Database")
	    const mainTitle = document.getElementById('mainTitle');
	    if (mainTitle && t.mainTitle) mainTitle.innerText = t.mainTitle;
	
	    // Перевод подзаголовка или описания
	    const subTitle = document.getElementById('subTitle');
	    if (subTitle && t.subTitle) subTitle.innerText = t.subTitle;
	
	    // Перевод подписи к текстовому поиску по имени
	    const searchLabel = document.getElementById('searchLabel');
	    if (searchLabel && t.searchLabel) searchLabel.innerText = t.searchLabel;
	
	    // Перевод плейсхолдера (подсказки ввода) в текстовом поле поиска
	    const searchInput = document.getElementById('searchInput');
	    if (searchInput && t.searchPlaceholder) searchInput.placeholder = t.searchPlaceholder;
	
	    // === БЛОК 4: ПЕРЕВОД ТЕКСТОВЫХ ПОДПИСЕЙ (LABEL) У ФИЛЬТРОВ ===
	    // Меняем названия блоков фильтрации перед выпадающими списками (select)
	    const classFilterLabel = document.getElementById('classFilterLabel');
	    if (classFilterLabel && t.classLabel) classFilterLabel.innerText = t.classLabel + ':';
	
	    const raceFilterLabel = document.getElementById('raceFilterLabel');
	    if (raceFilterLabel && t.raceLabel) raceFilterLabel.innerText = t.raceLabel + ':';
	
	    const allianceFilterLabel = document.getElementById('allianceFilterLabel');
	    if (allianceFilterLabel && t.allianceLabel) allianceFilterLabel.innerText = t.allianceLabel + ':';
	
	    const elementFilterLabel = document.getElementById('elementFilterLabel');
	    if (elementFilterLabel && t.elementLabel) elementFilterLabel.innerText = t.elementLabel + ':';
	
	    const typeFilterLabel = document.getElementById('typeFilterLabel');
	    if (typeFilterLabel && t.typeFilterLabel) typeFilterLabel.innerText = t.typeFilterLabel + ':';
	
	    // === БЛОК 5: ДИНАМИЧЕСКИЙ ПЕРЕВОД ОПЦИЙ В ВЫПАДАЮЩИХ СПИСКАХ (SELECT) ===
	    // Переводим самый первый пункт ("Все") в каждом выпадающем списке, 
	    // а также остальные опции, если они завязаны на мапперы.
	    
	    // Список фильтрации классов
	    const classSelect = document.getElementById('classSelect');
	    if (classSelect && classSelect.options[0]) {
	        classSelect.options[0].text = t.allOption || 'Все';
	    }
	
	    // Список фильтрации рас
	    const raceSelect = document.getElementById('raceSelect');
	    if (raceSelect && raceSelect.options[0]) {
	        raceSelect.options[0].text = t.allOption || 'Все';
	    }
	
	    // Список фильтрации альянсов
	    const allianceSelect = document.getElementById('allianceSelect');
	    if (allianceSelect && allianceSelect.options[0]) {
	        allianceSelect.options[0].text = t.allOption || 'Все';
	    }
	
	    // Список фильтрации стихий
	    const elementSelect = document.getElementById('elementSelect');
	    if (elementSelect && elementSelect.options[0]) {
	        elementSelect.options[0].text = t.allOption || 'Все';
	    }
	
	    // Список фильтрации типов персонажей ("Легендарный", "Эпический" и т.д.)
	    const typeSelect = document.getElementById('typeSelect');
	    if (typeSelect) {
	        if (typeSelect.options[0]) typeSelect.options[0].text = t.allOption || 'Все';
	        // Для типа персонажей (так как значения строковые) мы можем перевести и остальные опции напрямую
	        for (let i = 1; i < typeSelect.options.length; i++) {
	            const rawValue = typeSelect.options[i].value;
	            if (typeMapper[lang] && typeMapper[lang][rawValue]) {
	                typeSelect.options[i].text = typeMapper[lang][rawValue];
	            }
	        }
	    }
	
	    // === БЛОК 6: ПЕРЕЗАПУСК ОБНОВЛЕНИЯ ДАННЫХ И КАРТОЧЕК ===
	    // После того как весь интерфейс переведен, вызываем основную функцию 
	    // обновления экрана. Обычно это функция filterHeroes() или updateDisplay(), 
	    // которая берет текущие фильтры, обрабатывает массив и в самом конце вызывает renderCards(filteredData).
	    // Если у вас используется прямая функция, замените на неё (например, renderCards(heroesData)).
	    if (typeof updateDisplay === 'function') {
	        updateDisplay();
	    } else if (typeof filterHeroes === 'function') {
	        filterHeroes();
	    } else if (typeof heroesData !== 'undefined' && heroesData.length > 0) {
	        renderCards(heroesData);
	    }
	}


	/**
	 * Функция рендеринга карточек персонажей на страницу.
	 * @param {Array} data - Массив объектов персонажей из JSON-файла herous.json
	 */
	function renderCards(data) {
	    // === БЛОК 1: ОЧИСТКА КОНТЕЙНЕРА ===
	    // Полностью очищаем сетку перед выводом, чтобы карточки не дублировались
	    // при повторном вызове функции (например, при переключении языка или фильтрации)
	    grid.innerHTML = '';
	
	    // === БЛОК 2: ПРОВЕРКА НА ПУСТЫЕ ДАННЫЕ ===
	    // Если после фильтрации массив пуст, выводим сообщение об отсутствии результатов
	    if (!data || data.length === 0) {
	        grid.innerHTML = `<div class="no-results">${uiTranslations[currentLang].noResults || 'Ничего не найдено'}</div>`;
	        return;
	    }
	
	    // === БЛОК 3: ПЕРЕБОР МАССИВА ДАННЫХ ===
	    // Проходим циклом по каждому персонажу в массиве
	    data.forEach(hero => {
	        // Защита от ошибок: если объект данных поврежден, пропускаем итерацию
	        if (!hero || !hero.data) return;
	
	        // === БЛОК 4: ИЗОЛЯЦИЯ СТРОКОВЫХ ДАННЫХ JSON (БЕЗ ПЕРЕВОДА) ===
	        // Извлекаем имя персонажа напрямую из JSON. Как вы и просили, 
	        // текстовые данные (строки и символы персонажа) остаются на русском языке.
	        const heroName = hero.data.name ? hero.data.name.trim() : 'Без имени';
	
	        // === БЛОК 5: ДИНАМИЧЕСКИЙ ДВУЯЗЫЧНЫЙ МАППИНГ ===
	        // С помощью переменной 'currentLang' ('ru' или 'en') мы забираем нужный перевод 
	        // из наших языковых словарей. Если перевода нет, оставляем исходный ID/текст как запасной вариант.
	        
	        // Перевод типа персонажа (например, "Легендарный" / "Legendary")
	        const characterTypeRaw = hero.data.character_type ? hero.data.character_type.trim() : '';
	        const displayType = (typeMapper[currentLang] && typeMapper[currentLang][characterTypeRaw]) || characterTypeRaw;
	
	        // Перевод класса по его числовому ID (например, 1 -> "Сила" / "Strength")
	        const displayClass = (classMapper[currentLang] && classMapper[currentLang][hero.data.class_id]) || hero.data.class_id;
	
	        // Перевод расы по её числовому ID (например, 2 -> "Человек" / "Human")
	        const displayRace = (raceMapper[currentLang] && raceMapper[currentLang][hero.data.race_id]) || hero.data.race_id;
	
	        // Перевод альянса/фракции по её числовому ID
	        const displayAlliance = (allianceMapper[currentLang] && allianceMapper[currentLang][hero.data.alliance_id]) || hero.data.alliance_id;
	
	        // Перевод стихии (элемента) по числовому ID
	        const displayElement = (elementMapper[currentLang] && elementMapper[currentLang][hero.data.element_id]) || hero.data.element_id;
	
	        // === БЛОК 6: СБОРКА HTML-ШАБЛОНА КАРТОЧКИ ===
	        // Создаем DOM-элемент для карточки героя
	        const card = document.createElement('div');
	        // Добавляем базовый класс стилей и дополнительный класс типа для стилизации рамок/фонов
	        card.className = `hero-card ${characterTypeRaw.toLowerCase()}`;
	
	        // Наполняем карточку структурой. Все переменные display... автоматически 
	        // подставят либо русский, либо английский текст в зависимости от active-языка.
	        card.innerHTML = `
	            <div class="hero-header">
	                <!-- Имя выводится строго на русском языке, как в исходном файле -->
	                <h3 class="hero-name">${heroName}</h3>
	                <span class="badge badge-type">${displayType}</span>
	            </div>
	            <div class="hero-body">
	                <div class="hero-info-item">
	                    <span class="info-label">${uiTranslations[currentLang].classLabel || 'Класс'}:</span>
	                    <span class="info-value">${displayClass}</span>
	                </div>
	                <div class="hero-info-item">
	                    <span class="info-label">${uiTranslations[currentLang].raceLabel || 'Раса'}:</span>
	                    <span class="info-value">${displayRace}</span>
	                </div>
	                <div class="hero-info-item">
	                    <span class="info-label">${uiTranslations[currentLang].allianceLabel || 'Альянс'}:</span>
	                    <span class="info-value">${displayAlliance}</span>
	                </div>
	                <div class="hero-info-item">
	                    <span class="info-label">${uiTranslations[currentLang].elementLabel || 'Стихия'}:</span>
	                    <span class="info-value">${displayElement}</span>
	                </div>
	            </div>
	        `;
	
	        // === БЛОК 7: ДОБАВЛЕНИЕ КАРТОЧКИ НА СТРАНИЦУ ===
	        // Вставляем готовую собранную карточку персонажа в общую сетку grid
	        grid.appendChild(card);
	    });
	}
    
    // Функция обработки поиска, фильтрации и сортировки
    function updateDisplay() {
        let updatedList = [...heroesData];

        // 1. Поиск (по совпадению подстроки в имени без учета регистра)
        const searchValue = searchInput.value.toLowerCase().trim();
        if (searchValue) {
            updatedList = updatedList.filter(hero => 
                hero.data.name.toLowerCase().includes(searchValue)
            );
        }

        // 2. Фильтрация по типу
        const typeValue = filterType.value;
        if (typeValue !== 'all') {
            updatedList = updatedList.filter(hero => 
                hero.data.character_type.trim() === typeValue
            );
        }
		
        // 2. Фильтрация по классу
        const classValue = filterClass.value;
        if (classValue !== 'all') {
        	updatedList = updatedList.filter(hero => hero.data.class_id === Number(classValue));
        }
		
        // 2. Фильтрация по альянсу
        const allianceValue = filterAlliance.value;
        if (allianceValue !== 'all') {
        	updatedList = updatedList.filter(hero => hero.data.alliance_id === Number(allianceValue));
        }
		
		// 2. Фильтрация по расе
        const raceValue = filterRace.value;
        if (raceValue !== 'all') {
        	updatedList = updatedList.filter(hero => hero.data.race_id === Number(raceValue));
        }
		
		// 3. Сортировка по имени и ID
		const sortValue = sortMIX.value;
		if (sortValue === 'ascName') {
		    updatedList.sort((a, b) => a.data.name.trim().localeCompare(b.data.name.trim()));
		} else if (sortValue === 'descName') {
		    updatedList.sort((a, b) => b.data.name.trim().localeCompare(a.data.name.trim()));
		} else if (sortValue === 'ascBaseID') {
            updatedList.sort((a, b) => a.data.base_character_id - b.data.base_character_id);
        } else if (sortValue === 'descBaseID') {
            updatedList.sort((a, b) => b.data.base_character_id - a.data.base_character_id);
		} else if (sortValue === 'none') {
            updatedList.sort((a, b) => a.data.base_character_id - b.data.base_character_id);
		}

        renderCards(updatedList);
    }

    // Слушатели событий управления
    searchInput.addEventListener('input', updateDisplay);
	filterType.addEventListener('change', updateDisplay);
	filterClass.addEventListener('change', updateDisplay);
	filterAlliance.addEventListener('change', updateDisplay);
	filterRace.addEventListener('change', updateDisplay);
	sortMIX.addEventListener('change', updateDisplay);
	document.getElementById('languageSelect').addEventListener('change', function(event) {
	    setLanguage(event.target.value);
	});
    //document.getElementById('btnRu').addEventListener('click', () => setLanguage('ru'));
	//document.getElementById('btnEn').addEventListener('click', () => setLanguage('en'));
    // Инициализация
    loadHeroes();
</script>
