<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный JSON Фильтр</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            text-align: center;
            background-color: #f4f7f6;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        input[type="file"] { display: none; }
        .file-label {
            display: inline-block;
            padding: 14px 28px;
            background-color: #0969da;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        .file-label:hover { background-color: #1f85ff; }
        #status { margin-top: 25px; font-weight: bold; color: #555; word-wrap: break-word; }
        .config-info {
            margin-top: 20px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #0969da;
            font-size: 13px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Локальная фильтрация JSON</h2>
        <p>Выберите скачанный файл с компьютера для моментальной очистки.</p>
        
        <label for="fileInput" class="file-label">Выбрать и обработать файл</label>
        <input type="file" id="fileInput" accept=".json">

        <div class="config-info">
            <strong>Текущие сохраняемые поля (изменяются в коде):</strong>
            <div id="activeFields"></div>
        </div>
    </div>
    
    <div id="status"></div>

    <script>
        // =========================================================================
        // НАСТРОЙКА ПОЛЕЙ: Редактируйте этот список для изменения правил фильтрации.
        // Можно указывать как простые ключи, так и точные пути через точку.
        // =========================================================================
        const FIELDS_TO_KEEP = [
            'data.name',
            'data.character_type',
            'data.class_id',
            'data.alliance_id',
            'data.race_id',
            'data.avatar',
            'data.icon',
            'data.base_character_id',
			'data.max_stardom'
        ];

        // Вывод списка полей на экран для наглядности
        // document.getElementById('activeFields').innerText = JSON.stringify(FIELDS_TO_KEEP, null, 2);
		
		// НОВЫЙ СПИСОК: Поля и пути, которые будут полностью удалены
		const FIELDS_TO_REMOVE = [
			'data.item_ids', 
			'data.level', 
			'data.power', 
			'data.ability_ids', 
			'data.id', 
			'data.params', 
			'data.abilities', 
			'data.items', 
			'data.hero_shard_id', 
			'data.max_level', 
			'data.is_owned', 
			'data.has_shards', 
			'data.minimal_for_activate', 
			'data.can_activate', 
			'data.has_some_shards', 
			'data.rarity'
		];

		// Обновленный вывод для наглядности
		document.getElementById('activeFields').innerHTML = 
			`<strong>Сохранять:</strong><pre>${JSON.stringify(FIELDS_TO_KEEP, null, 2)}</pre>` +
			`<strong>Удалять:</strong><pre>${JSON.stringify(FIELDS_TO_REMOVE, null, 2)}</pre>`;

        // Главная функция фильтрации с поддержкой вложенности и путей через точку
        function filterJsonStructure(obj, currentPath = '') {
            // Если это массив, фильтруем каждый его элемент
            if (Array.isArray(obj)) {
                return obj.map(item => filterJsonStructure(item, currentPath))
                          .filter(item => {
                              if (item && typeof item === 'object') {
                                  return Object.keys(item).length > 0;
                              }
                              return item !== undefined;
                          });
            } 
            
            // Если это объект, разбираем его ключи
            if (obj !== null && typeof obj === 'object') {
                const newObj = {};
                let hasValidData = false;

                for (const key in obj) {
                    // Строим полный путь для текущего ключа (например: "data" -> "data.name")
                    const fullPath = currentPath ? `${currentPath}.${key}` : key;
					
					// --- ПРОВЕРКА ЧЕРНОГО СПИСКА ---
					if (FIELDS_TO_REMOVE.includes(fullPath) || FIELDS_TO_REMOVE.includes(key)) {
						continue; // Пропускаем поле и всю вложенность
					}

                    // Проверяем, совпадает ли точный путь ИЛИ имя самого ключа с белым списком
                    const isAllowed = FIELDS_TO_KEEP.includes(fullPath) || FIELDS_TO_KEEP.includes(key);

                    if (isAllowed && obj[key] !== undefined && typeof obj[key] !== 'object') {
                        // Сохраняем простые типы данных (строки, числа), если они разрешены
                        newObj[key] = obj[key];
                        hasValidData = true;
                    } else if (obj[key] && typeof obj[key] === 'object') {
                        // Если внутри объект или массив, спускаемся глубже
                        const filteredChild = filterJsonStructure(obj[key], fullPath);
                        
                        // Если в глубине нашлись нужные поля, сохраняем эту ветку структуры
                        if (filteredChild !== undefined && (Array.isArray(filteredChild) ? filteredChild.length > 0 : Object.keys(filteredChild).length > 0)) {
                            newObj[key] = filteredChild;
                            hasValidData = true;
                        } else if (isAllowed) {
                            // Если разрешен весь объект целиком, сохраняем его
                            newObj[key] = filteredChild;
                            hasValidData = true;
                        }
                    }
                }
                return hasValidData ? newObj : {};
            }

            return obj;
        }

        // Функция скачивания результата
        function downloadJson(data) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const downloadUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'filtered_source.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(downloadUrl);
        }

        // Слушатель выбора файла
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('status');
            statusDiv.style.color = '#555';
            statusDiv.innerText = 'Чтение файла...';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    statusDiv.innerText = 'Парсинг JSON...';
                    const rawJson = JSON.parse(e.target.result);
                    
                    statusDiv.innerText = 'Фильтрация по заданной структуре...';
                    const filteredJson = filterJsonStructure(rawJson);
                    
                    statusDiv.innerText = 'Сохранение файла на диск...';
                    downloadJson(filteredJson);

                    statusDiv.style.color = '#238636';
                    statusDiv.innerText = 'Успешно! Отфильтрованный файл сохранен в "Загрузки".';
                } catch (error) {
                    statusDiv.style.color = '#d32f2f';
                    statusDiv.innerText = 'Ошибка обработки: ' + error.message;
                    console.error(error);
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
